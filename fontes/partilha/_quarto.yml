project:
  type: default
  render:
    - 01_licitacoes_secretas.qmd
    - 02_ajuste_na_partilha.qmd
    - 03_marcadores.qmd

lang: pt
author: "MACS · 10.º ano"
institute: "Escola Secundária de Amarante"

format:
  revealjs:
    theme: [default, estilo.scss]
    width: 1280
    height: 720
    margin: 0.06
    transition: slide
    background-transition: fade
    transition-speed: default
    slide-number: c/t
    show-slide-number: all
    hash-type: number
    progress: true
    controls: true
    controls-layout: bottom-right
    menu:
      side: left
      width: normal
    chalkboard:
      theme: whiteboard
      boardmarker-width: 4
      chalk-width: 5
    multiplex: true
    preview-links: auto
    code-line-numbers: true
    highlight-style: github
    html-math-method: mathjax
    footer: "MACS 10.º ano · Modelos matemáticos na partilha"
