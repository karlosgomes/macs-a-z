<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://karlosgomes.github.io/weblog/site_libs/bootstrap/bootstrap-icons.css">
<style>
/* barra do weblog (cores e fonte de https://karlosgomes.github.io/weblog/), como no Matemática A...Z */
:root { --barra: 62px; }
.barra-weblog { position: fixed; top: 0; left: 0; right: 0; height: var(--barra); z-index: 100; box-sizing: border-box;
	display: flex; align-items: center; gap: 8px; padding: 0 1.5em; background: #170C3A; font: 17px/1.5 "Jost", system-ui, sans-serif; }
.barra-weblog ul { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
.barra-weblog .icones { margin-left: auto; }
.barra-weblog a { display: block; padding: 8px; color: #fff; text-decoration: none; white-space: nowrap; }
.barra-weblog a:hover { color: rgba(251, 158, 7, 0.8); }
.barra-weblog a.ativo { color: #FB9E07; }
.barra-weblog .icones a { font-size: 1.2em; }
.barra-weblog .marca { padding: 0 4px 0 0; }
.barra-weblog .marca img { height: 24px; display: block; }
.barra-weblog .menu-botao { display: none; margin-left: auto; background: none; border: none; color: #fff; font-size: 1.8em; cursor: pointer; }
@media (max-width: 991px) {
	.barra-weblog .menu-botao { display: block; }
	.barra-weblog ul { display: none; }
	.barra-weblog.aberto { flex-wrap: wrap; height: auto; padding-bottom: 10px; }
	.barra-weblog.aberto ul { display: block; flex-basis: 100%; }
	.barra-weblog.aberto .icones { display: flex; margin-left: 0; }
}
.reveal { top: var(--barra); height: calc(100% - var(--barra)) !important; }
.ecra-inteiro .barra-weblog { display: none; }
.ecra-inteiro .reveal { top: 0; height: 100% !important; }
/* no site, o logótipo já está na barra: tira-se o dos diapositivos */
.reveal .slides::before { display: none !important; }
.reveal .slides section:not(.stack) > h2:first-of-type { margin-left: 0 !important; }
</style>
<!-- GoatCounter: contagem de visitas, sem cookies (não conta em localhost) -->
<script data-goatcounter="https://karlosgomes.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
